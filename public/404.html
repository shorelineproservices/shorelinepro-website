<!DOCTYPE html>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --navy: #1F2D50;
            --amber: #B8863B;
            --amber-light: #D9A94A;
            --cream: #F5F1E8;
        }
        body {
            font-family: 'DM Sans', sans-serif;

            background: var(--cream);
        }
        .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }
        .hero {

            text-align: center;
        }
        .hero .wrap { display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .brandmark { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; }
        .brandmark .dot { width: 8px; height: 8px; background: var(--amber); border-radius: 50%; display: inline-block; }
        h1 { font-family: 'Playfair Display', serif; font-size: 40px; }
        .sub { font-size: 18px; color: rgba(255,255,255,0.9); max-width: 480px; }
        .btn-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 28px; font-size: 16px; font-weight: 600;
            border-radius: 4px; text-decoration: none; font-family: 'DM Sans', sans-serif;
        }
        .btn-primary { background: var(--amber-light); color: var(--navy); }
        .btn-secondary { background: rgba(255,255,255,0.2); color: #fff; border: 2px solid #fff; }
    </style>
